<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TopoSoft — Graficar</title>

  <!-- PLOTLY MEDIANTE CDN -->
  <script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>

  <style>
    :root { --gap:10px; --color-primary:#1F3A5F; --color-primary-dark:#0B1F44; --color-bg-full:#f3d5bc; --color-bg-container:#FFFFFF; --color-bg-soft:#E6EEFF; --color-text-main:#1F3A5F; --color-text-hide:#817c7c; --color-border:#E5E7EB; --color-danger:#EF4444; }
    body { background-color:var(--color-bg-full); font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; margin:24px; color:var(--color-text-main); }
    .container { background:var(--color-bg-container); border:1px solid var(--color-border); border-radius:12px; padding:16px; box-shadow:0 2px 8px rgba(0,0,0,.06); }
    .columna { display:flex; gap:var(--gap); align-items:center; flex-wrap:wrap; }
    .hide { color:var(--color-text-hide); font-size:.9rem; }
    label { display:block; margin-top:6px; font-weight:600; color:var(--color-primary-dark); }
    select { padding:10px; border-radius:8px; border:1px solid var(--color-border); background:#fff; color:var(--color-text-main); min-width:260px; }
    select:focus { outline:none; border-color:var(--color-primary); }
    button { padding:10px; border-radius:8px; border:none; cursor:pointer; background:var(--color-primary); color:#fff; font-weight:600; }
    button:hover { background:#2E5077; }
    .graf { font-size:12px; background:var(--color-bg-soft); color:var(--color-primary); border-radius:8px; padding:2px 8px; font-weight:600; }
    #plot { width: 100%; height: 70vh; min-height: 420px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace; font-size: .9rem; }
  </style>
</head>
<body>

<!--Nombre y botones de navegación-->
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:5px;">
    <h1 style="font-size: 45px;"><strong>TopoSoft</strong></h1>
    <nav class="columna">
      <button><a style="color: #FFFFFF; text-decoration:none;" href="index.html"><strong>Back</strong></a></button>
      <button><a style="color: #FFFFFF; text-decoration:none;" href="ayuda.html"><strong>Help!</strong></a></button>
    </nav>
  </div>

  <div class="container">
    <h3>GRAFICAR POLIGONAL (3D)</h3>
    <div class="columna">
      <label>Medición
        <select id="medida"></select>
      </label>
      <button id="btnGraficar" style="margin-top:5px">Graficar</button>
      <span id="status" class="graf"></span>
    </div>
  </div>

  <div class="container" style="margin-top: var(--gap)">
    <div id="plot"></div>
    <p id="emptyMensaje" class="hide" style="display:none;">La medición no tiene puntos.</p>
  </div>

  <script type="module">
    const API = "http://127.0.0.1:8000";
    const el = (id) => document.getElementById(id);

    function deg2rad(d) { return d * Math.PI / 180.0; }

    function getQueryMedidaId() {
      const url = new URL(window.location.href);
      const mid = url.searchParams.get("medida_id");
      return mid ? Number(mid) : null;
    }

    function setQueryMedidaId(mid) {
      const url = new URL(window.location.href);
      url.searchParams.set("medida_id", String(mid));
      window.history.replaceState({}, "", url);
    }

    async function cargarMedidas() {
      const res = await fetch(API + "/medidas?page=1&limit=200");
      const data = await res.json();

      const sel = el("medida");
      sel.innerHTML = "";

      const optNone = document.createElement("option");
      optNone.value = ""; optNone.textContent = "- Selecciona una medición -";
      sel.appendChild(optNone);

      for (const m of data.items) {
        const opt = document.createElement("option");
        opt.value = String(m.id);
        opt.textContent = m.name;
        sel.appendChild(opt);
      }

      const mid = getQueryMedidaById();
      if (mid && data.items.some(m => m.id === mid)) sel.value = String(mid);
    }

    async function loadAllPuntos(medidaId) {
      const limit = 100;
      let page = 1;
      let all = [];

      while (true) {
        const url = new URL(API + "/puntos");
        url.searchParams.set("page", page);
        url.searchParams.set("limit", limit);
        url.searchParams.set("medida_id", medidaId);

        const res = await fetch(url.toString());
        if (!res.ok) return [];
        const data = await res.json();

        all = all.concat(data.items || []);
        if (page >= (data.pages || 1)) break;
        page += 1;
      }

      // El backend te devuelve por defecto el orden en DESC; por lo que tenemos que cambiar a ASC para el recorrido
      all.sort((a, b) => a.id - b.id);
      return all;
    }


    async function loadAllRadiaciones(medidaId) {
      const limit = 100;
      let page = 1;
      let all = [];

      while (true) {
        const url = new URL(API + "/radiaciones");
        url.searchParams.set("page", page);
        url.searchParams.set("limit", limit);
        url.searchParams.set("medida_id", medidaId);

        const res = await fetch(url.toString());

        // Si el backend aún no tiene /radiations (404) o falla, no rompas el plot.
        if (!res.ok) return [];

        const data = await res.json();

        all = all.concat(data.items || []);
        if (page >= (data.pages || 1)) break;
        page += 1;
      }

      all.sort((a, b) => a.id - b.id);
      return all;
    }

    function buildRecorrido(points) {
      let x = 0, y = 0, z = 0;
      const byPointId = {}; // point.id -> coordenadas del vértice tras aplicar el tramo

      const X = [x], Y = [y], Z = [z];
      const hover = ["P0 (origen)<br>x=0.000<br>y=0.000<br>z=0.000"];

      points.forEach((p, i) => {
        const d = Number(p.distancia || 0);
        const az = deg2rad(Number(p.azimut || 0));
        const inc = deg2rad(Number(p.inclinacion || 0));

        const horiz = d * Math.cos(inc);
        const dx = horiz * Math.sin(az);
        const dy = horiz * Math.cos(az);
        const dz = d * Math.sin(inc);

        x += dx; y += dy; z += dz;

        X.push(x); Y.push(y); Z.push(z);

        const label = p.label ? String(p.label) : `P${i+1}`;
        byPointId[p.id] = { x, y, z, label };
        hover.push(
          `${label}<br>` +
          `Coordenada x = ${x.toFixed(3)}<br>Coordenada y = ${y.toFixed(3)}<br>Coordenada z = ${z.toFixed(3)}<br>` +
          `Distancia = ${d.toFixed(3)} | Azimut = ${Number(p.azimut).toFixed(2)}° | Inclinación = ${Number(p.inclinacion).toFixed(2)}°`
        );
      });

      return { X, Y, Z, hover, byPointId };
    }

    function drawPlot(trayectoria, title) {
      const trace = {
        type: "scatter3d",
        mode: "lines+markers",
        x: trayectoria.X, y: trayectoria.Y, z: trayectoria.Z,
        text: trayectoria.hover,
        hoverinfo: "text",
        name: "Recorrido"
      };

      const layout = {
        title: { text: title },
        margin: { l: 0, r: 0, b: 0, t: 40 },
        scene: {
          xaxis: { title: "Eje X (Este)" },
          yaxis: { title: "Eje Y (Norte)" },
          zaxis: { title: "Eje Z (Arriba)" },
          aspectmode: "data"
        }
      };

      Plotly.newPlot("plot", [trace], layout, { responsive: true });
    }

    async function graficar() {
      const sel = el("medida");
      const mid = sel.value ? Number(sel.value) : null;
      if (!mid) { alert("Selecciona una medición."); return; }

      setQueryMedidaId(mid);
      el("status").textContent = "Cargando recorrido topográfico......";
      el("emptyMensaje").style.display = "Nada";

      const points = await loadAllPuntos(mid);
      const radiations = await loadAllRadiaciones(mid);

      if (!points.length) {
        Plotly.purge("plot");
        el("status").textContent = "0 puntos";
        el("emptyMensaje").style.display = "block";
        return;
      }

      const trayectoria = buildRecorrido(points);
      const nombreMedida = sel.options[sel.selectedIndex]?.textContent ?? `Medición ${mid}`;

      // Radiaciones: calculamos coordenadas absolutas usando la estación (punto base) como origen
      const RX = [], RY = [], RZ = [], Rhover = [];
      const lineX = [], lineY = [], lineZ = [];

      for (const r of radiations) {
        const base = trayectoria.byPointId[r.base_point_id];
        if (!base) continue;

        const d = Number(r.distancia || 0);
        const az = deg2rad(Number(r.azimut || 0));
        const inc = deg2rad(Number(r.inclinacion || 0));

        const horiz = d * Math.cos(inc);
        const dx = horiz * Math.sin(az);
        const dy = horiz * Math.cos(az);
        const dz = d * Math.sin(inc);

        const x = base.x + dx;
        const y = base.y + dy;
        const z = base.z + dz;

        RX.push(x); RY.push(y); RZ.push(z);

        const label = r.label ? String(r.label) : `R${r.id}`;
        Rhover.push(
          `${label}<br>` +
          `Estación base = ${base.label} (id ${r.base_point_id})<br>` +
          `Coordenada x = ${x.toFixed(3)}<br>Coordenada y = ${y.toFixed(3)}<br>Coordenada z = ${z.toFixed(3)}<br>` +
          `Distancia = ${d.toFixed(3)} | Azimut = ${Number(r.azimut).toFixed(2)}° | Inclinación = ${Number(r.inclinacion).toFixed(2)}°`
        );

        // Línea estación -> radiación (separamos segmentos con null)
        lineX.push(base.x, x, null);
        lineY.push(base.y, y, null);
        lineZ.push(base.z, z, null);
      }

      const tracePol = {
        type: "scatter3d",
        mode: "lines+markers",
        x: trayectoria.X, y: trayectoria.Y, z: trayectoria.Z,
        text: trayectoria.hover,
        hoverinfo: "text",
        name: "Poligonal"
      };

      const traceLinks = {
        type: "scatter3d",
        mode: "lines",
        x: lineX, y: lineY, z: lineZ,
        hoverinfo: "skip",
        name: "Vínculo"
      };

      const traceRad = {
        type: "scatter3d",
        mode: "markers",
        x: RX, y: RY, z: RZ,
        text: Rhover,
        hoverinfo: "text",
        name: "Radiaciones"
      };

      const layout = {
        title: { text: `Recorrido 3D — ${nombreMedida} (${points.length} segmento/s, ${radiations.length} radiación/es)` },
        margin: { l: 0, r: 0, b: 0, t: 40 },
        scene: {
          xaxis: { title: "Eje X (Este)" },
          yaxis: { title: "Eje Y (Norte)" },
          zaxis: { title: "Eje Z (Arriba)" },
          aspectmode: "data"
        }
      };

      Plotly.newPlot("plot", [tracePol, traceLinks, traceRad], layout, { responsive: true });

      el("status").textContent = `${points.length + 1} puntos, ${radiations.length} radiaciones`;
    }

    el("btnGraficar").onclick = graficar;

    await cargarMedidas();
    if (getQueryMedidaId()) await graficar();
  </script>
</body>
</html>
