<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TopoSoft — Graficar</title>

  <!-- Plotly (CDN) -->
  <script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>

  <style>
    :root { --gap:10px; --color-primary:#1F3A5F; --color-primary-dark:#0B1F44; --color-bg-full:#f3d5bc; --color-bg-card:#FFFFFF; --color-bg-soft:#E6EEFF; --color-text-main:#1F3A5F; --color-text-hide:#817c7c; --color-border:#E5E7EB; --color-danger:#EF4444; }
    body { background-color:var(--color-bg-full); font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; margin:24px; color:var(--color-text-main); }
    .card { background:var(--color-bg-card); border:1px solid var(--color-border); border-radius:12px; padding:16px; box-shadow:0 2px 8px rgba(0,0,0,.06); }
    .row { display:flex; gap:var(--gap); align-items:center; flex-wrap:wrap; }
    .hide { color:var(--color-text-hide); font-size:.9rem; }
    label { display:block; margin-top:6px; font-weight:600; color:var(--color-primary-dark); }
    select { padding:10px; border-radius:8px; border:1px solid var(--color-border); background:#fff; color:var(--color-text-main); min-width:260px; }
    select:focus { outline:none; border-color:var(--color-primary); }
    button { padding:10px; border-radius:8px; border:none; cursor:pointer; background:var(--color-primary); color:#fff; font-weight:600; }
    button:hover { background:#2E5077; }
    .badge { font-size:12px; background:var(--color-bg-soft); color:var(--color-primary); border-radius:8px; padding:2px 8px; font-weight:600; }
    #plot { width: 100%; height: 70vh; min-height: 420px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace; font-size: .9rem; }
  </style>
</head>
<body>

  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:5px;">
    <h1 style="font-size: 45px;"><strong>TopoSoft</strong></h1>
    <nav class="row">
      <button><a style="color: #FFFFFF; text-decoration:none;" href="index.html"><strong>Back</strong></a></button>
      <button><a style="color: #FFFFFF; text-decoration:none;" href="ayuda.html"><strong>Help!</strong></a></button>
    </nav>
  </div>

  <div class="card">
    <h3>GRAFICAR POLIGONAL (3D)</h3>
    <div class="row" style="margin-top:8px">
      <label>Medición
        <select id="measurement"></select>
      </label>
      <button id="btnGraficar" style="margin-top:22px">Graficar</button>
      <span id="status" class="badge"></span>
    </div>

    <p class="hide" style="margin-top:10px;">
      Convención usada (ajústala si tu proyecto usa otra):
      <span class="mono">X = Este</span>, <span class="mono">Y = Norte</span>, <span class="mono">Z = Arriba</span>.
      Azimut: 0° = Norte, sentido horario. Inclinación: respecto al horizontal (positiva hacia arriba).
    </p>
  </div>

  <div class="card" style="margin-top: var(--gap)">
    <div id="plot"></div>
    <p id="emptyMsg" class="hide" style="display:none;">Esta medición no tiene puntos todavía.</p>
  </div>

  <script type="module">
    const API = "http://127.0.0.1:8000";
    const el = (id) => document.getElementById(id);

    function deg2rad(d) { return d * Math.PI / 180.0; }

    function getQueryMeasurementId() {
      const url = new URL(window.location.href);
      const mid = url.searchParams.get("measurement_id");
      return mid ? Number(mid) : null;
    }

    function setQueryMeasurementId(mid) {
      const url = new URL(window.location.href);
      url.searchParams.set("measurement_id", String(mid));
      window.history.replaceState({}, "", url);
    }

    async function cargarMedidas() {
      const res = await fetch(API + "/measurements?page=1&limit=200");
      const data = await res.json();

      const sel = el("measurement");
      sel.innerHTML = "";

      const optNone = document.createElement("option");
      optNone.value = ""; optNone.textContent = "-- Selecciona --";
      sel.appendChild(optNone);

      for (const m of data.items) {
        const opt = document.createElement("option");
        opt.value = String(m.id);
        opt.textContent = m.name;
        sel.appendChild(opt);
      }

      const mid = getQueryMeasurementId();
      if (mid && data.items.some(m => m.id === mid)) sel.value = String(mid);
    }

    async function fetchAllPoints(measurementId) {
      const limit = 100;
      let page = 1;
      let all = [];

      while (true) {
        const url = new URL(API + "/points");
        url.searchParams.set("page", page);
        url.searchParams.set("limit", limit);
        url.searchParams.set("measurement_id", measurementId);

        const res = await fetch(url.toString());
        const data = await res.json();

        all = all.concat(data.items || []);
        if (page >= (data.pages || 1)) break;
        page += 1;
      }

      // El backend devuelve por defecto en DESC; reordenamos a ASC para el recorrido
      all.sort((a, b) => a.id - b.id);
      return all;
    }

    function buildTrajectory(points) {
      let x = 0, y = 0, z = 0;

      const X = [x], Y = [y], Z = [z];
      const hover = ["P0 (origen)<br>x=0.000<br>y=0.000<br>z=0.000"];

      points.forEach((p, i) => {
        const d = Number(p.distancia || 0);
        const az = deg2rad(Number(p.azimut || 0));
        const inc = deg2rad(Number(p.inclinacion || 0));

        const horiz = d * Math.cos(inc);
        const dx = horiz * Math.sin(az);
        const dy = horiz * Math.cos(az);
        const dz = d * Math.sin(inc);

        x += dx; y += dy; z += dz;

        X.push(x); Y.push(y); Z.push(z);

        const label = p.label ? String(p.label) : `P${i+1}`;
        hover.push(
          `${label}<br>` +
          `x=${x.toFixed(3)}<br>y=${y.toFixed(3)}<br>z=${z.toFixed(3)}<br>` +
          `dist=${d.toFixed(3)} | az=${Number(p.azimut).toFixed(2)}° | inc=${Number(p.inclinacion).toFixed(2)}°`
        );
      });

      return { X, Y, Z, hover };
    }

    function renderPlot(traj, title) {
      const trace = {
        type: "scatter3d",
        mode: "lines+markers",
        x: traj.X, y: traj.Y, z: traj.Z,
        text: traj.hover,
        hoverinfo: "text",
        name: "Recorrido"
      };

      const layout = {
        title: { text: title },
        margin: { l: 0, r: 0, b: 0, t: 40 },
        scene: {
          xaxis: { title: "X (Este)" },
          yaxis: { title: "Y (Norte)" },
          zaxis: { title: "Z (Arriba)" },
          aspectmode: "data"
        }
      };

      Plotly.newPlot("plot", [trace], layout, { responsive: true });
    }

    async function graficar() {
      const sel = el("measurement");
      const mid = sel.value ? Number(sel.value) : null;
      if (!mid) { alert("Selecciona una medición."); return; }

      setQueryMeasurementId(mid);
      el("status").textContent = "Cargando puntos…";
      el("emptyMsg").style.display = "none";

      const points = await fetchAllPoints(mid);

      if (!points.length) {
        Plotly.purge("plot");
        el("status").textContent = "0 puntos";
        el("emptyMsg").style.display = "block";
        return;
      }

      const traj = buildTrajectory(points);
      const measName = sel.options[sel.selectedIndex]?.textContent ?? `Medición ${mid}`;
      renderPlot(traj, `Recorrido 3D — ${measName} (${points.length} tramos)`);

      el("status").textContent = `${points.length} puntos`;
    }

    el("btnGraficar").onclick = graficar;

    await cargarMedidas();
    if (getQueryMeasurementId()) await graficar();
  </script>
</body>
</html>
